<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안전 미어캣 — 현장 안전관리</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 한국 산업안전 색채기준(KS)에서 의미색만 가져옵니다 — 장식이 아니라 상태 전달용입니다.
     위험=빨강, 주의=노랑, 안전=녹색, 지시=파랑. 나머지는 종이처럼 조용한 중성색으로 둡니다. */
  :root {
    --paper: #F7F7F5;
    --surface: #FFFFFF;
    --line: #DDDCD7;
    --line-soft: #EDECE8;
    --ink: #1A1D21;
    --ink-2: #5B6169;
    --ink-3: #8A9099;
    --danger: #C8322B;
    --caution: #B77A16;
    --safe: #1F7A4D;
    --instruct: #1D4E89;
    --focus: #1D4E89;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- 로그인 ---------- */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); padding: 32px; }
  .login-card h1 { font-size: 19px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .login-card .sub { color: var(--ink-2); font-size: 13px; margin: 0 0 24px; }
  label.field { display: block; margin-bottom: 14px; }
  label.field span { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 5px; }
  input[type=text], input[type=password], input[type=date], input[type=number], select, textarea {
    width: 100%; padding: 9px 11px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 2px;
  }
  textarea { min-height: 72px; resize: vertical; }
  .btn { padding: 9px 16px; border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 2px; font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-quiet { background: var(--surface); color: var(--ink); border-color: var(--line); font-weight: 500; }
  .btn-danger { background: var(--surface); color: var(--danger); border-color: var(--line); font-weight: 500; }
  .btn-sm { padding: 4px 9px; font-size: 12px; }
  .msg { margin-top: 14px; padding: 10px 12px; font-size: 13px; border-left: 3px solid var(--danger); background: #FBF0EF; color: #8C241F; }
  .msg.ok { border-left-color: var(--safe); background: #EFF6F1; color: #145836; }

  /* ---------- 레이아웃 ---------- */
  #app { display: none; min-height: 100vh; grid-template-columns: 208px 1fr; }
  #app.on { display: grid; }
  aside { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  .brand { padding: 18px 18px 14px; border-bottom: 1px solid var(--line-soft); }
  .brand b { display: block; font-size: 15px; letter-spacing: -0.01em; }
  .brand span { font-size: 11px; color: var(--ink-3); }
  nav { flex: 1; overflow-y: auto; padding: 10px 0 20px; }
  .nav-group { font-size: 11px; color: var(--ink-3); padding: 14px 18px 5px; }
  nav button {
    display: block; width: 100%; text-align: left; padding: 7px 18px;
    background: none; border: 0; border-left: 3px solid transparent; color: var(--ink-2); font-size: 13px;
  }
  nav button:hover { background: var(--paper); color: var(--ink); }
  nav button.sel { border-left-color: var(--ink); color: var(--ink); font-weight: 600; background: var(--paper); }
  .who { padding: 12px 18px; border-top: 1px solid var(--line-soft); font-size: 12px; color: var(--ink-2); }
  .who b { display: block; color: var(--ink); font-size: 13px; }

  main { min-width: 0; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 22px;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  header h2 { font-size: 16px; margin: 0; flex: 1; letter-spacing: -0.01em; }
  header select { width: auto; min-width: 150px; padding: 6px 10px; font-size: 13px; }
  #searchbox { width: 210px; padding: 6px 10px; font-size: 13px; }
  .content { flex: 1; padding: 22px; overflow-x: auto; }

  /* ---------- 표 ---------- */
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  th { font-size: 12px; color: var(--ink-2); font-weight: 600; background: #FAFAF8; white-space: nowrap; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: #FCFCFA; }
  td.actions { white-space: nowrap; text-align: right; }
  td.empty, td.loading { text-align: center; color: var(--ink-3); padding: 34px; }

  /* 상태는 알약 대신 좌측 색막대로 — 표를 훑을 때 세로로 읽힙니다 */
  .status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12.5px; }
  .status::before { content: ""; width: 3px; height: 13px; background: var(--ink-3); }
  .status.s-danger::before { background: var(--danger); }
  .status.s-caution::before { background: var(--caution); }
  .status.s-safe::before { background: var(--safe); }
  .status.s-instruct::before { background: var(--instruct); }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .toolbar .count { color: var(--ink-2); font-size: 13px; margin-right: auto; }

  /* ---------- 개요 ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .kpi { background: var(--surface); padding: 14px 16px; }
  .kpi .v { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .kpi .k { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
  .kpi.alert .v { color: var(--danger); }

  /* ---------- 모달 ---------- */
  .modal { position: fixed; inset: 0; background: rgba(26,29,33,.45); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 50; }
  .modal.on { display: flex; }
  .modal-box { background: var(--surface); border: 1px solid var(--line); width: 100%; max-width: 620px; max-height: 88vh; display: flex; flex-direction: column; }
  .modal-head { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--line); }
  .modal-head h3 { margin: 0; font-size: 15px; flex: 1; }
  .modal-body { padding: 20px; overflow-y: auto; }
  .modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .grid2 .full { grid-column: 1 / -1; }
  .x { background: none; border: 0; color: var(--ink-3); font-size: 17px; line-height: 1; padding: 2px 4px; }

  .att-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
  .att-row a { color: var(--instruct); flex: 1; text-decoration: none; }
  .att-row a:hover { text-decoration: underline; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  @media (max-width: 860px) { #app.on { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login">
  <div class="login-card">
    <h1>안전 미어캣</h1>
    <p class="sub">현장 안전관리 업무 시스템</p>
    <label class="field"><span>서버 주소</span><input type="text" id="l-server" placeholder="https://example.onrender.com"></label>
    <label class="field"><span>아이디</span><input type="text" id="l-id" autocomplete="username"></label>
    <label class="field"><span>비밀번호</span><input type="password" id="l-pw" autocomplete="current-password"></label>
    <button class="btn" style="width:100%" id="l-btn" onclick="App.login()">로그인</button>
    <div id="l-msg" class="msg" style="display:none"></div>
  </div>
</div>

<!-- 동의 게이트 -->
<div id="consent" class="modal">
  <div class="modal-box" style="max-width:420px">
    <div class="modal-head"><h3>서비스 이용 동의</h3></div>
    <div class="modal-body">
      <p style="margin:0 0 14px;color:var(--ink-2);font-size:13px">계속하려면 아래 항목에 모두 동의해야 합니다.</p>
      <label class="field" style="display:flex;gap:9px;align-items:flex-start;margin-bottom:10px">
        <input type="checkbox" id="c-privacy" style="width:auto;margin-top:3px">
        <span style="margin:0;color:var(--ink);font-size:13px">개인정보 수집·이용에 동의합니다 <button class="x" style="font-size:12px;color:var(--instruct);text-decoration:underline" onclick="App.showPolicy('privacy')">전문 보기</button></span>
      </label>
      <label class="field" style="display:flex;gap:9px;align-items:flex-start;margin-bottom:10px">
        <input type="checkbox" id="c-terms" style="width:auto;margin-top:3px">
        <span style="margin:0;color:var(--ink);font-size:13px">이용약관에 동의합니다 <button class="x" style="font-size:12px;color:var(--instruct);text-decoration:underline" onclick="App.showPolicy('terms')">전문 보기</button></span>
      </label>
      <label class="field" style="display:flex;gap:9px;align-items:flex-start;margin-bottom:0">
        <input type="checkbox" id="c-sensitive" style="width:auto;margin-top:3px">
        <span style="margin:0;color:var(--ink);font-size:13px">건강진단 기록 등 민감정보 처리에 동의합니다</span>
      </label>
      <div id="c-msg" class="msg" style="display:none"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-quiet" onclick="App.logout()">로그아웃</button>
      <button class="btn" onclick="App.submitConsent()">동의하고 시작</button>
    </div>
  </div>
</div>

<!-- 정책 전문 -->
<div id="policy" class="modal" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="modal-box">
    <div class="modal-head"><h3 id="policy-title">문서</h3><button class="x" onclick="document.getElementById('policy').classList.remove('on')">✕</button></div>
    <div class="modal-body"><pre id="policy-body" style="white-space:pre-wrap;font-family:inherit;font-size:12.5px;color:var(--ink-2);margin:0"></pre></div>
  </div>
</div>

<!-- 본체 -->
<div id="app">
  <aside>
    <div class="brand"><b>안전 미어캣</b><span>현장 안전관리</span></div>
    <nav id="nav"></nav>
    <div class="who"><b id="who-name">—</b><span id="who-role"></span><br>
      <button class="x" style="font-size:12px;color:var(--ink-2);text-decoration:underline;padding-left:0" onclick="App.logout()">로그아웃</button>
    </div>
  </aside>
  <main>
    <header>
      <h2 id="view-title">개요</h2>
      <label class="sr" for="site-sel">사업장 선택</label>
      <select id="site-sel" onchange="App.changeSite(this.value)"></select>
      <label class="sr" for="searchbox">통합검색</label>
      <input type="text" id="searchbox" placeholder="전체 검색 (Enter)" onkeydown="if(event.key==='Enter')App.search(this.value)">
      <button class="btn btn-sm" id="new-btn" onclick="App.openForm()" style="display:none">+ 새로 등록</button>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- 등록/수정 -->
<div id="form" class="modal" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="modal-box">
    <div class="modal-head"><h3 id="form-title">등록</h3><button class="x" onclick="document.getElementById('form').classList.remove('on')">✕</button></div>
    <div class="modal-body"><div class="grid2" id="form-fields"></div><div id="form-msg" class="msg" style="display:none"></div></div>
    <div class="modal-foot">
      <button class="btn btn-quiet" onclick="document.getElementById('form').classList.remove('on')">취소</button>
      <button class="btn" id="form-save" onclick="App.saveForm()">저장</button>
    </div>
  </div>
</div>

<!-- 첨부파일 -->
<div id="att" class="modal" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="modal-box" style="max-width:460px">
    <div class="modal-head"><h3>첨부파일</h3><button class="x" onclick="document.getElementById('att').classList.remove('on')">✕</button></div>
    <div class="modal-body"><div id="att-list"></div></div>
    <div class="modal-foot">
      <input type="file" id="att-file" style="flex:1" accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx,.xls,.xlsx">
      <button class="btn" onclick="App.uploadAtt()">올리기</button>
    </div>
  </div>
</div>

<script>
// ============================================================================
// 안전 미어캣 — 현장사무실 PC용 웹 플랫폼
// 모바일 PWA(빠른 현장 입력)·관제센터(경영진 KPI)와 같은 서버·계정을 씁니다.
// 이 화면의 역할은 "하루 업무를 실제로 처리하는 것" — 대량 조회·검색·등록·수정입니다.
// ============================================================================

const POLICY_VERSION = '2026-09-05-v2';
const PRIVACY_TEXT = `안전미어캣 프로 개인정보처리방침

시행일: 2026년 9월 5일 / 버전: ${POLICY_VERSION}

이 서비스를 운영하는 사업자는 「개인정보보호법」 등 관련 법령을 준수하며, 산업안전보건 관리 서비스 제공을 위해 개인정보를 처리합니다.

수집 항목: 아이디, 비밀번호(암호화 저장), 이름, 소속 사업장. 선택적으로 직급·사번·연락처. 서비스 이용 중 작성하신 안전관리 기록. 건강진단 기록은 민감정보로 별도 동의를 받습니다.

이용 목적: 회원 식별 및 계정 관리, 산업안전보건법·중대재해처벌법 등에 따른 안전관리 업무 수행 및 기록 보존.

보유 기간: 회원 정보는 탈퇴 시까지이며 탈퇴 시 로그인 정보는 즉시 익명화합니다. 안전관리 기록은 관련 법령이 정한 보존기간 동안 유지되며, 작성자 표시만 "탈퇴한 사용자"로 대체됩니다.

정보주체의 권리: 언제든 열람·정정·삭제·처리정지를 요구할 수 있습니다.

부칙: 사업자등록번호 000 (등록 절차 진행 중이며 완료 시 갱신됩니다)`;

const TERMS_TEXT = `안전미어캣 프로 이용약관

시행일: 2026년 9월 5일 / 버전: ${POLICY_VERSION}

제1조(목적) 이 약관은 회사가 제공하는 산업안전보건 관리 서비스의 이용조건 및 절차, 권리·의무 및 책임사항을 규정합니다.

제2조(서비스) 위험성평가, 개선조치(CAPA), 사고관리, 아차사고, 안전교육, 건강검진, 법정선임, 협력업체 관리, 보호구 지급, TBM, 작업허가서, 소리함, 법정회의·점검 기능을 제공합니다.

제3조(이용자의 의무) 타인의 계정 도용, 서비스 운영 방해, 허위 안전관리 기록 입력을 해서는 안 됩니다.

제4조(면책) 입력된 안전관리 기록의 정확성에 대한 최종 책임은 작성자 및 소속 사업장에 있으며, 서비스는 기록·관리 도구를 제공합니다.

부칙: 사업자등록번호 000 (등록 절차 진행 중이며 완료 시 갱신됩니다)`;

// ---------------------------------------------------------------------------
// 모듈 정의 — 서버 라우트의 body 키와 정확히 일치해야 합니다.
//   col : GET 응답의 DB 컬럼명 (표에 보여줄 때)
//   key : POST/PATCH가 받는 camelCase 키 (저장할 때)
// 이 둘이 다르기 때문에 한 곳에 같이 적어 어긋나지 않게 합니다.
// ---------------------------------------------------------------------------
const F = (col, key, label, type, opts) => ({ col, key, label, type: type || 'text', opts });

const MODULES = [
  { id: 'risk', path: '/risks', label: '위험성평가', perm: 'risk',
    fields: [
      F('process_name', 'processName', '공정/설비'), F('task_name', 'taskName', '작업명'),
      F('hazard', 'hazard', '유해·위험요인', 'textarea'), F('existing_measures', 'existingMeasures', '현재 안전조치', 'textarea'),
      F('likelihood', 'likelihood', '가능성(1-5)', 'number'), F('severity', 'severity', '중대성(1-5)', 'number'),
      F('risk_score', null, '위험성'), F('reduction_measures', 'reductionMeasures', '감소대책', 'textarea'),
      F('due_date', 'dueDate', '개선기한', 'date'), F('related_contractor', 'relatedContractor', '관련 협력업체'),
      F('status', null, '상태'),
    ], list: ['process_name', 'hazard', 'risk_score', 'due_date', 'status'] },

  { id: 'capa', path: '/capa', label: '개선조치(CAPA)', perm: 'capa', noCreate: true,
    fields: [F('title', 'title', '제목'), F('source_type', null, '발생원'), F('description', 'description', '내용', 'textarea'),
      F('due_date', 'dueDate', '기한', 'date'), F('status', null, '상태')],
    list: ['title', 'source_type', 'due_date', 'status'] },

  { id: 'ptw', path: '/ptw', label: '작업허가서(PTW)', perm: 'ptw',
    fields: [F('title', 'title', '작업명'), F('location', 'location', '작업장소'), F('work_time', 'time', '작업시간'),
      F('work_date', 'date', '작업일', 'date'), F('manager', 'manager', '작업책임자'), F('worker', 'worker', '작업자'),
      F('hazard', 'hazard', '위험요인', 'textarea'), F('measure', 'measure', '안전조치', 'textarea'),
      F('related_contractor', 'relatedContractor', '협력업체'), F('memo', 'memo', '비고', 'textarea'), F('status', null, '상태')],
    list: ['title', 'location', 'work_date', 'status'] },

  { id: 'accident', path: '/accident', label: '산업재해', perm: 'accident',
    fields: [F('occurred_date', 'date', '발생일', 'date'), F('occurred_time', 'time', '발생시각'),
      F('location', 'location', '발생장소'), F('victim_name', 'victimName', '재해자'),
      F('injury_type', 'injuryType', '재해형태'), F('body_part', 'bodyPart', '상해부위'),

// 서버 attachments.js의 화이트리스트와 정확히 일치해야 합니다.
// 2026-09-05 점검: 개인 건강정보·정신건강 정보를 담는 모듈입니다.
// 관리자가 업무상 직접 조회하는 것은 필요하지만, "전체 검색"으로 우연히 딸려 나오면
// 찾을 의도가 없던 개인정보까지 보게 됩니다. 그래서 검색 결과에서 따로 표시하고,
// 왜 조심해야 하는지 함께 알립니다.
const SENSITIVE_MODULES = ['health', 'ergosym', 'stresscns'];

const ATT_TYPES = {
  risk: 'risk_assessment', accident: 'incident', nearmiss: 'near_miss', tbm: 'tbm', voice: 'voice',
  legalmeet: 'legalmeet', msds: 'msds', health: 'health', edu: 'edu', ppe: 'ppe',
  appoint: 'appoint', contractor: 'contractor', ptw: 'ptw', capa: 'capa', equipment: 'equipment', process: 'process', loto: 'loto', workenv: 'workenv', ergo: 'ergonomic', stress: 'stress', inspection: 'inspection', budgetitem: 'budgetitem', ctreval: 'ctreval',
};

// CAPA/PTW 상태 전이 — 서버 정의와 동일하게 유지합니다.
const CAPA_NEXT = { '등록': '조치중', '조치중': '완료요청', '완료요청': '검증중', '검증중': '승인', '반려': '조치중', '승인': '종결' };
const PTW_NEXT = { '등록': '위험확인중', '위험확인중': '승인대기', '승인대기': '승인됨', '승인됨': '작업중', '작업중': '종료' };
// LOTO는 잔류에너지 확인이 끝나야 '작업중'으로 넘어갑니다(서버가 다시 검증합니다).
const LOTO_NEXT = { '신청': '차단완료', '차단완료': '작업중', '작업중': '복구완료', '복구완료': '종료' };

// 상태별 의미색 — 산업안전 색채기준을 따릅니다.
function statusClass(s) {
  if (!s) return '';
  if (/반려|기한초과|중대/.test(s)) return 's-danger';
  if (/등록|대기|진행|조치중|확인중|검증중|완료요청/.test(s)) return 's-caution';
  if (/완료|종결|승인|종료|정상/.test(s)) return 's-safe';
  if (/작업중/.test(s)) return 's-instruct';
  return '';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(v) {
  if (v === null || v === undefined || v === '') return '—';
  return String(v).length > 60 ? String(v).slice(0, 60) + '…' : String(v);
}

const Api = {
  BASE_KEY: 'sm_web_base', TOKEN_KEY: 'sm_web_token', USER_KEY: 'sm_web_user',
  getBase() { return (localStorage.getItem(this.BASE_KEY) || '').replace(/\/$/, ''); },
  getToken() { return localStorage.getItem(this.TOKEN_KEY) || ''; },
  getUser() { try { return JSON.parse(localStorage.getItem(this.USER_KEY) || 'null'); } catch (e) { return null; } },
  async request(method, path, body) {
    const res = await fetch(this.getBase() + path, {
      method,
      headers: { 'Content-Type': 'application/json', ...(this.getToken() ? { Authorization: 'Bearer ' + this.getToken() } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `요청이 실패했습니다 (${res.status})`);
    return data;
  },
};

const App = {
  view: 'overview', sites: [], siteId: '', editing: null, attCtx: null,

  // ---------- 인증 ----------
  async login() {
    const base = document.getElementById('l-server').value.trim();
    const id = document.getElementById('l-id').value.trim();
    const pw = document.getElementById('l-pw').value;
    const msg = document.getElementById('l-msg');
    const btn = document.getElementById('l-btn');
    if (!base || !id || !pw) { this.showMsg(msg, '서버 주소와 아이디, 비밀번호를 모두 입력해 주세요.'); return; }
    localStorage.setItem(Api.BASE_KEY, base);
    btn.disabled = true; btn.textContent = '연결 중…';
    try {
      const r = await Api.request('POST', '/auth/login', { loginId: id, password: pw });
      localStorage.setItem(Api.TOKEN_KEY, r.token);
      localStorage.setItem(Api.USER_KEY, JSON.stringify(r.user));
      msg.style.display = 'none';
      if (r.user.needsConsent) { document.getElementById('consent').classList.add('on'); }
      else { this.enter(); }
    } catch (e) {
      this.showMsg(msg, e.message);
    } finally { btn.disabled = false; btn.textContent = '로그인'; }
  },
  async submitConsent() {
    const ok = ['c-privacy', 'c-terms', 'c-sensitive'].every((i) => document.getElementById(i).checked);
    const msg = document.getElementById('c-msg');
    if (!ok) { this.showMsg(msg, '세 항목에 모두 동의해야 계속할 수 있습니다.'); return; }
    try {
      await Api.request('POST', '/auth/consent', { agreePrivacy: true, agreeTerms: true, agreeSensitive: true });
      const u = Api.getUser(); if (u) { u.needsConsent = false; localStorage.setItem(Api.USER_KEY, JSON.stringify(u)); }
      document.getElementById('consent').classList.remove('on');
      this.enter();
    } catch (e) { this.showMsg(msg, e.message); }
  },
  showPolicy(kind) {
    document.getElementById('policy-title').textContent = kind === 'privacy' ? '개인정보처리방침' : '이용약관';
    document.getElementById('policy-body').textContent = kind === 'privacy' ? PRIVACY_TEXT : TERMS_TEXT;
    document.getElementById('policy').classList.add('on');
  },
  logout() {
    localStorage.removeItem(Api.TOKEN_KEY); localStorage.removeItem(Api.USER_KEY);
    document.getElementById('app').classList.remove('on');
    document.getElementById('consent').classList.remove('on');
    document.getElementById('login').style.display = 'grid';
  },
  showMsg(el, text, ok) { el.textContent = text; el.className = 'msg' + (ok ? ' ok' : ''); el.style.display = 'block'; },

  async enter() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').classList.add('on');
    const u = Api.getUser() || {};
    document.getElementById('who-name').textContent = u.name || '';
    document.getElementById('who-role').textContent = (u.roles || []).join(', ');
    this.renderNav();
    await this.loadSites();
    this.go('overview');
  },

  // ---------- 사업장 ----------
  // 서버가 사업장 지정 등록을 지원하므로(resolveTargetSiteId), 여기서 고른 사업장이
  // 조회 필터이자 "새로 만들 데이터가 들어갈 곳"이 됩니다.
  async loadSites() {
    const sel = document.getElementById('site-sel');
    try {
      this.sites = await Api.request('GET', '/sites');
    } catch (e) { this.sites = []; }
    const u = Api.getUser() || {};
    const opts = ['<option value="">전체 사업장</option>']
      .concat(this.sites.map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`));
    sel.innerHTML = opts.join('');
    // 소속 사업장이 있으면 그것을 기본 선택 — 대부분의 사용자는 자기 현장만 봅니다.
    this.siteId = (u.siteId && this.sites.some((s) => s.id === u.siteId)) ? u.siteId : '';
    sel.value = this.siteId;

  changeSite(v) { this.siteId = v; this.refresh(); },
  siteName(id) { const s = this.sites.find((x) => x.id === id); return s ? s.name : id; },

  // ---------- 내비게이션 ----------
  renderNav() {
    const nav = document.getElementById('nav');
    nav.innerHTML = `<button data-v="overview" onclick="App.go('overview')">개요</button>`
      + `<div class="nav-group">안전관리</div>`
      + MODULES.map((m) => `<button data-v="${m.id}" onclick="App.go('${m.id}')">${esc(m.label)}</button>`).join('');

  go(v) {
    this.view = v;
    [...document.querySelectorAll('#nav button')].forEach((b) => b.classList.toggle('sel', b.dataset.v === v));
    const mod = MODULES.find((m) => m.id === v);
    document.getElementById('view-title').textContent = mod ? mod.label : '개요';
    document.getElementById('new-btn').style.display = (mod && !mod.noCreate) ? '' : 'none';
    this.refresh();
  },
  refresh() {
    if (this.view === 'overview') this.renderOverview();
    else if (this.view === 'search') this.search(this._lastQuery);
    else this.renderList();
  },

  scoped(rows) { return this.siteId ? rows.filter((r) => r.site_id === this.siteId) : rows; },

  // ---------- 개요 (2026-09-05: 서버 집계 기반 사업장 비교) ----------
  // 예전에는 25개 모듈 목록을 전부 내려받아 브라우저에서 셌습니다. 사업장이 여러 개고
  // 데이터가 수천 건이면 화면이 멎습니다. 이제 서버가 COUNT로 집계해 숫자만 내려주므로,
  // 데이터가 아무리 늘어도 응답 크기가 변하지 않습니다.
  async renderOverview() {
    const el = document.getElementById('content');
    el.innerHTML = `<p style="color:var(--ink-3)">불러오는 중…</p>`;
    let d;
    try { d = await Api.request('GET', '/dashboard'); }
    catch (e) { el.innerHTML = `<p class="msg">${esc(e.message)}</p>`; return; }

    if (!d.sites.length) { el.innerHTML = `<p style="color:var(--ink-2)">아직 사업장이 없습니다.</p>`; return; }

    // 선택된 사업장이 있으면 그 현장만, 없으면 전 현장 비교
    const shown = this.siteId ? d.sites.filter((s) => s.siteId === this.siteId) : d.sites;
    const scope = this.siteId ? shown[0].alerts : d.totals.alerts;

    const alertCards = Object.entries(scope).map(([k, v]) => {
      const label = k.replace(/_/g, ' ');
      return `<div class="kpi ${v > 0 ? 'alert' : ''}"><div class="v num">${v}</div><div class="k">${esc(label)}</div></div>`;
    }).join('');

    // 현장이 둘 이상이면 비교표를 보여줍니다 — 어느 현장이 문제인지 한눈에 보이도록.
    let compare = '';
    if (!this.siteId && d.sites.length > 1) {
      const alertKeys = Object.keys(d.totals.alerts);
      compare = `<h3 style="font-size:14px;margin:26px 0 10px">사업장별 비교</h3>
        <table><thead><tr><th>사업장</th>${alertKeys.map((k) => `<th style="text-align:right">${esc(k.replace(/_/g, ' '))}</th>`).join('')}</tr></thead>
        <tbody>${d.sites.map((s) => `<tr>
            <td>${esc(s.siteName)}</td>
            ${alertKeys.map((k) => {
              const v = s.alerts[k] || 0;
              return `<td class="num" style="text-align:right${v > 0 ? ';color:var(--danger);font-weight:600' : ''}">${v}</td>`;
            }).join('')}
          </tr>`).join('')}</tbody></table>`;
    }

    // 모듈별 등록 건수
    const counts = this.siteId ? shown[0].counts : d.totals.counts;
    const countRows = Object.entries(d.moduleLabels)
      .map(([k, label]) => `<div class="kpi"><div class="v num">${counts[k] || 0}</div><div class="k">${esc(label)}</div></div>`).join('');

    el.innerHTML = `<h3 style="font-size:14px;margin:0 0 10px">주의가 필요한 항목 ${this.siteId ? `— ${esc(shown[0].siteName)}` : '(전사)'}</h3>
      <div class="kpis">${alertCards}</div>
      ${compare}
      <h3 style="font-size:14px;margin:26px 0 10px">모듈별 등록 건수</h3>
      <div class="kpis">${countRows}</div>
      <p style="color:var(--ink-3);font-size:12px;margin-top:14px">${esc(d.asOf)} 기준 · 서버에서 집계한 값입니다.</p>`;
  },

  // ---------- (구) 개요 ----------
  async _renderOverviewLegacy() {
    const el = document.getElementById('content');
    el.innerHTML = `<div class="kpis" id="kpis"><div class="kpi"><div class="v">…</div><div class="k">불러오는 중</div></div></div>`;
    const results = await Promise.all(MODULES.map(async (m) => {
      try { return { m, rows: this.scoped(await Api.request('GET', m.path)) }; }
      catch (e) { return { m, rows: [], failed: true }; }
    }));
    const today = new Date().toISOString().slice(0, 10);
    const capa = (results.find((r) => r.m.id === 'capa') || {}).rows || [];
    const overdue = capa.filter((c) => c.due_date && c.due_date < today && !/종결|승인/.test(c.status || ''));
    const highRisk = ((results.find((r) => r.m.id === 'risk') || {}).rows || []).filter((r) => Number(r.risk_score) >= 15);

    document.getElementById('kpis').innerHTML =
      `<div class="kpi ${overdue.length ? 'alert' : ''}"><div class="v num">${overdue.length}</div><div class="k">기한 초과 개선조치</div></div>`
      + `<div class="kpi ${highRisk.length ? 'alert' : ''}"><div class="v num">${highRisk.length}</div><div class="k">고위험 항목(15점 이상)</div></div>`
      + results.map((r) => `<div class="kpi"><div class="v num">${r.failed ? '—' : r.rows.length}</div><div class="k">${esc(r.m.label)}</div></div>`).join('');

    if (overdue.length) {
      el.insertAdjacentHTML('beforeend', `<h3 style="font-size:14px;margin:26px 0 10px">기한이 지난 개선조치</h3>`
        + `<table><thead><tr><th>제목</th><th>기한</th><th>상태</th>${this.siteId ? '' : '<th>사업장</th>'}</tr></thead><tbody>`
        + overdue.map((c) => `<tr><td>${esc(c.title)}</td><td class="num">${esc(c.due_date)}</td>`
          + `<td><span class="status ${statusClass(c.status)}">${esc(c.status)}</span></td>`
          + (this.siteId ? '' : `<td>${esc(this.siteName(c.site_id))}</td>`) + `</tr>`).join('')
        + `</tbody></table>`);
    }
  },

  // ---------- 목록 ----------
  async renderList() {
    const mod = MODULES.find((m) => m.id === this.view);
    if (!mod) return;
    const el = document.getElementById('content');
    const cols = mod.list.map((c) => mod.fields.find((f) => f.col === c)).filter(Boolean);
    const head = cols.map((f) => `<th>${esc(f.label)}</th>`).join('')
      + (this.siteId ? '' : '<th>사업장</th>') + '<th></th>';
    el.innerHTML = `<div class="toolbar"><span class="count" id="count">불러오는 중…</span></div>`
      + `<table><thead><tr>${head}</tr></thead><tbody id="rows"><tr><td class="loading" colspan="${cols.length + 2}">불러오는 중…</td></tr></tbody></table>`;
    try {
      const rows = this.scoped(await Api.request('GET', mod.path));
      document.getElementById('count').textContent = `${rows.length}건`;
      const body = document.getElementById('rows');
      if (!rows.length) { body.innerHTML = `<tr><td class="empty" colspan="${cols.length + 2}">아직 등록된 항목이 없습니다. 오른쪽 위 “새로 등록”으로 시작하세요.</td></tr>`; return; }
      body.innerHTML = rows.map((r) => {
        const tds = cols.map((f) => f.col === 'status'
          ? `<td><span class="status ${statusClass(r.status)}">${esc(r.status || '—')}</span></td>`
          : `<td>${esc(fmt(r[f.col]))}</td>`).join('');
        const next = mod.id === 'capa' ? CAPA_NEXT[r.status] : (mod.id === 'ptw' ? PTW_NEXT[r.status] : (mod.id === 'loto' ? LOTO_NEXT[r.status] : null));
        return `<tr>${tds}${this.siteId ? '' : `<td>${esc(this.siteName(r.site_id))}</td>`}<td class="actions">`
          + (mod.id === 'loto' && r.status === '차단완료' && r.residual_checked !== 1
              ? `<button class="btn btn-quiet btn-sm" data-id="${esc(r.id)}" onclick="App.residualCheck(this.dataset.id)" style="color:var(--danger)">잔류에너지 확인</button> ` : '')
          + (next ? `<button class="btn btn-quiet btn-sm" data-id="${esc(r.id)}" data-next="${esc(next)}" onclick="App.advance(this)">${esc(next)}</button> ` : '')
          + (mod.id === 'contractor' ? `<button class="btn btn-quiet btn-sm" data-id="${esc(r.id)}" onclick="App.showPerformance(this.dataset.id)">안전성과</button> ` : '')
          + (ATT_TYPES[mod.id] ? `<button class="btn btn-quiet btn-sm" data-id="${esc(r.id)}" onclick="App.openAtt(this.dataset.id)">첨부</button> ` : '')
          + `<button class="btn btn-quiet btn-sm" data-id="${esc(r.id)}" onclick="App.openForm(this.dataset.id)">수정</button> `
          + `<button class="btn btn-danger btn-sm" data-id="${esc(r.id)}" onclick="App.remove(this.dataset.id)">삭제</button>`
          + `</td></tr>`;
      }).join('');
      this._rows = rows;
    } catch (e) {
      document.getElementById('count').textContent = '';
      document.getElementById('rows').innerHTML = `<tr><td class="empty" colspan="${cols.length + 2}">${esc(e.message)}</td></tr>`;
    }
  },

  async advance(btn) {
    const mod = MODULES.find((m) => m.id === this.view);
    const id = encodeURIComponent(btn.dataset.id);
    const path = mod.id === 'capa' ? `/capa/${id}/status`
      : (mod.id === 'loto' ? `/loto/permits/${id}/status` : `/ptw/${id}/status`);
    try { await Api.request('PATCH', path, { status: btn.dataset.next }); this.renderList(); }
    catch (e) { alert(e.message); }
  },

  // LOTO 전용: 잔류에너지 확인 기록. 이걸 해야 '작업중'으로 넘어갈 수 있습니다.
  async residualCheck(id) {
    const checker = prompt('잔류에너지를 확인한 사람의 이름을 적어주세요.\n\n압축공기·유압·전기 등이 완전히 해소되었는지 직접 확인한 뒤 입력하세요.');
    if (!checker) return;
    try {
      await Api.request('PATCH', `/loto/permits/${encodeURIComponent(id)}/residual-check`, { checker });
      this.renderList();
    } catch (e) { alert(e.message); }
  },

  async remove(id) {
    const mod = MODULES.find((m) => m.id === this.view);
    if (!confirm('이 항목을 삭제할까요? 기록은 보존되지만 목록에서는 사라집니다.')) return;
    try { await Api.request('DELETE', `${mod.path}/${encodeURIComponent(id)}`); this.renderList(); }
    catch (e) { alert(e.message); }
  },

  // ---------- 등록/수정 ----------
  openForm(id) {
    const mod = MODULES.find((m) => m.id === this.view);
    if (!mod) return;
    const item = id ? (this._rows || []).find((r) => r.id === id) : null;
    this.editing = { modId: mod.id, id: id || null };
    document.getElementById('form-title').textContent = `${mod.label} ${id ? '수정' : '등록'}`;
    document.getElementById('form-msg').style.display = 'none';
    document.getElementById('form-fields').innerHTML = mod.fields.filter((f) => f.key).map((f) => {
      const v = item ? (item[f.col] == null ? '' : item[f.col]) : '';
      const wide = f.type === 'textarea' ? ' full' : '';
      const input = f.type === 'textarea'
        ? `<textarea id="ff-${f.key}">${esc(v)}</textarea>`
        : `<input type="${f.type}" id="ff-${f.key}" value="${esc(v)}">`;
      return `<label class="field${wide}"><span>${esc(f.label)}</span>${input}</label>`;
    }).join('');
    document.getElementById('form').classList.add('on');
  },

  async saveForm() {
    const mod = MODULES.find((m) => m.id === this.editing.modId);
    const msg = document.getElementById('form-msg');
    const body = {};
    mod.fields.filter((f) => f.key).forEach((f) => {
      const el = document.getElementById('ff-' + f.key);
      if (!el) return;
      const raw = el.value.trim();
      if (raw !== '') body[f.key] = (f.type === 'number') ? Number(raw) : raw;
    });
    // 새로 만들 때는 화면에서 고른 사업장으로 보냅니다(서버가 권한을 다시 검증합니다).
    if (!this.editing.id && this.siteId) body.siteId = this.siteId;
    const btn = document.getElementById('form-save');
    btn.disabled = true; btn.textContent = '저장 중…';
    try {
      if (this.editing.id) await Api.request('PATCH', `${mod.path}/${encodeURIComponent(this.editing.id)}`, body);
      else await Api.request('POST', mod.path, body);
      document.getElementById('form').classList.remove('on');
      this.renderList();
    } catch (e) {
      this.showMsg(msg, e.message);
    } finally { btn.disabled = false; btn.textContent = '저장'; }
  },

  // 2026-09-02(45-4절): 협력업체별 안전성과. 업체를 실제로 연결해둔 덕분에 표기가 달라도
  // 한 업체로 정확히 집계됩니다. 다만 점수·등급은 매기지 않습니다 - 평가 기준은 회사마다
  // 다르고, 잘못된 점수는 업체에 부당한 불이익을 주기 때문입니다. 사실(건수)만 보여줍니다.
  async showPerformance(id) {
    try {
      const r = await Api.request('GET', `/contractor/${encodeURIComponent(id)}/performance`);
      const rows = Object.entries(r.stats)
        .map(([k, v]) => `<tr><td>${esc(k)}</td><td class="num" style="text-align:right">${v}</td></tr>`).join('');
      const el = document.getElementById('content');
      el.innerHTML = `
        <div class="toolbar">
          <span class="count">${esc(r.contractor.companyName)} · ${esc(r.contractor.repName || '')} ${r.contractor.workType ? '· ' + esc(r.contractor.workType) : ''}</span>
          <button class="btn btn-quiet btn-sm" onclick="App.go('contractor')">← 목록으로</button>
        </div>
        <table><thead><tr><th>구분</th><th style="text-align:right">건수</th></tr></thead>
          <tbody>${rows}
            <tr><td><b>합계</b></td><td class="num" style="text-align:right"><b>${r.totalRecords}</b></td></tr>
          </tbody></table>
        <p style="color:var(--ink-2);font-size:12px;margin-top:12px">${esc(r.note)}</p>
        ${r.unlinkedNearmissCount ? `<p style="color:var(--caution);font-size:12px">업체명이 적혀 있지만 아직 연결되지 않은 아차사고가 ${r.unlinkedNearmissCount}건 있습니다. 협력업체 목록에 해당 업체를 등록하면 집계에 포함됩니다.</p>` : ''}`;
      document.getElementById('view-title').textContent = `${r.contractor.companyName} 안전성과`;
      document.getElementById('new-btn').style.display = 'none';
    } catch (e) { alert(e.message); }
  },

  // ---------- 첨부파일 ----------
  openAtt(id) {
    const mod = MODULES.find((m) => m.id === this.view);
    this.attCtx = { entityType: ATT_TYPES[mod.id], entityId: id };
    document.getElementById('att').classList.add('on');
    this.loadAtt();
  },
  async loadAtt() {
    const el = document.getElementById('att-list');
    const { entityType, entityId } = this.attCtx;
    el.innerHTML = '<p style="color:var(--ink-3);font-size:13px">불러오는 중…</p>';
    try {
      const items = await Api.request('GET', `/attachments?entityType=${encodeURIComponent(entityType)}&entityId=${encodeURIComponent(entityId)}`);
      el.innerHTML = items.length ? items.map((a) => `<div class="att-row">`
        + `<a href="#" data-att-id="${esc(a.id)}" data-att-name="${esc(a.file_name)}" onclick="App.download(this); return false;">${esc(a.file_name)}</a>`
        + `<button class="btn btn-danger btn-sm" data-att-id="${esc(a.id)}" onclick="App.delAtt(this.dataset.attId)">삭제</button></div>`).join('')
        : '<p style="color:var(--ink-3);font-size:13px">첨부된 파일이 없습니다.</p>';
    } catch (e) { el.innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
  },
  async uploadAtt() {
    const input = document.getElementById('att-file');
    if (!input.files[0]) { alert('올릴 파일을 먼저 선택해 주세요.'); return; }
    const fd = new FormData();
    fd.append('entityType', this.attCtx.entityType);
    fd.append('entityId', this.attCtx.entityId);
    fd.append('file', input.files[0]);
    try {
      const res = await fetch(Api.getBase() + '/attachments', { method: 'POST', headers: { Authorization: 'Bearer ' + Api.getToken() }, body: fd });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(d.error || '올리지 못했습니다.');
      input.value = ''; this.loadAtt();
    } catch (e) { alert(e.message); }
  },
  // 파일명은 절대 HTML 속성에 직접 넣지 않습니다 — data 속성에 담고 여기서 읽습니다.
  async download(el) {
    try {
      const res = await fetch(`${Api.getBase()}/attachments/${encodeURIComponent(el.dataset.attId)}/download`, { headers: { Authorization: 'Bearer ' + Api.getToken() } });
      if (!res.ok) throw new Error('내려받지 못했습니다.');
      const url = URL.createObjectURL(await res.blob());
      const a = document.createElement('a');
      a.href = url; a.download = el.dataset.attName || 'file';
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    } catch (e) { alert(e.message); }
  },
  async delAtt(id) {
    if (!confirm('이 첨부파일을 삭제할까요?')) return;
    try { await Api.request('DELETE', `/attachments/${encodeURIComponent(id)}`); this.loadAtt(); }
    catch (e) { alert(e.message); }
  },

  // ---------- 통합검색 ----------
  async search(q) {
    q = (q || '').trim();
    if (!q) return;
    this._lastQuery = q; this.view = 'search';
    [...document.querySelectorAll('#nav button')].forEach((b) => b.classList.remove('sel'));
    document.getElementById('view-title').textContent = `“${q}” 검색 결과`;
    document.getElementById('new-btn').style.display = 'none';
    const el = document.getElementById('content');
    el.innerHTML = '<p style="color:var(--ink-3)">찾는 중…</p>';
    const needle = q.toLowerCase();
    const found = await Promise.all(MODULES.map(async (m) => {
      try {
        const rows = this.scoped(await Api.request('GET', m.path))
          .filter((r) => Object.values(r).some((v) => v != null && String(v).toLowerCase().includes(needle)));
        return { m, rows };
      } catch (e) { return { m, rows: [] }; }
    }));
    const hits = found.filter((f) => f.rows.length);
    if (!hits.length) { el.innerHTML = `<p style="color:var(--ink-2)">“${esc(q)}”와 일치하는 항목이 없습니다. 다른 낱말로 찾아보세요.</p>`; return; }

    // 검색 결과에 개인 건강정보가 섞였다면 먼저 알립니다.
    const sensitiveHits = hits.filter((h) => SENSITIVE_MODULES.includes(h.m.id));
    const notice = sensitiveHits.length
      ? `<div style="border-left:3px solid var(--caution);background:#FDF8EE;padding:10px 12px;margin-bottom:16px;font-size:13px">
           검색 결과에 개인 건강정보(${sensitiveHits.map((h) => esc(h.m.label)).join(', ')})가 포함되어 있습니다.
           업무상 필요한 범위에서만 확인하시고, 화면을 다른 사람과 공유하지 마세요.
         </div>`
      : '';

    el.innerHTML = notice + hits.map(({ m, rows }) => {
      const cols = m.list.map((c) => m.fields.find((f) => f.col === c)).filter(Boolean);
      return `<h3 style="font-size:14px;margin:0 0 9px">${esc(m.label)} <span style="color:var(--ink-3);font-weight:400">${rows.length}건</span></h3>`
        + `<table style="margin-bottom:24px"><thead><tr>${cols.map((f) => `<th>${esc(f.label)}</th>`).join('')}</tr></thead><tbody>`
        + rows.map((r) => `<tr>${cols.map((f) => f.col === 'status'
          ? `<td><span class="status ${statusClass(r.status)}">${esc(r.status || '—')}</span></td>`
          : `<td>${esc(fmt(r[f.col]))}</td>`).join('')}</tr>`).join('')
        + `</tbody></table>`;
    }).join('');
  },
};

// 이미 로그인한 상태면 로그인 화면을 건너뜁니다.
(function boot() {
  const savedBase = localStorage.getItem(Api.BASE_KEY);
  if (savedBase) document.getElementById('l-server').value = savedBase;
  if (Api.getToken() && Api.getUser()) {
    const u = Api.getUser();
    if (u.needsConsent) document.getElementById('consent').classList.add('on');
    else App.enter();
  }
})();
</script>
</body>
</html>
